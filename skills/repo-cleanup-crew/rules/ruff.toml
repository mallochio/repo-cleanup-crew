select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "SIM",
  "TID",
  "RUF",
  "C90",
  "D",
  "ERA",
]

ignore = ["D100", "D103", "D104", "D203", "D212"]

line-length = 100

exclude = [
  ".agents",
  ".cache",
  "coverage",
  "dist",
  "node_modules",
  "tools/repo-cleanup-crew",
  "tools/oxlint",
]

per-file-ignores = {
  "tests/**" = ["D"]
}
