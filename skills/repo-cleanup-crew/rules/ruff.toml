# Interhuman Python house standard (aligned with InterhumanAI/open-omni-modeling).
# Standalone ruff.toml: top-level keys mirror [tool.ruff]; lint keys live under [lint].

line-length = 120
target-version = "py313"

exclude = [
  ".agents",
  ".cache",
  "coverage",
  "dist",
  "node_modules",
  "tools/repo-cleanup-crew",
  "tools/oxlint",
]

[lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "SIM",
  "TID",
  "RUF",
  "C901",
  "D",
  "ERA",
]

ignore = ["D100", "D103", "D104", "D203", "D212"]

[lint.mccabe]
max-complexity = 12

[lint.per-file-ignores]
"tests/**" = ["D"]
